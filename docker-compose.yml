# Run full stack from repo root: docker compose up --build
# - API: http://localhost:5205
# - SPA (nginx): http://localhost:3010  (proxies /api, /avatars, /chathub via BACKEND_URL)
services:
  db:
    image: postgres:15
    container_name: postgres_communicator
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: portfolio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  api:
    build:
      context: ./api/Api
      dockerfile: Dockerfile
    container_name: api_communicator
    ports:
      - "5205:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=portfolio;Username=postgres;Password=password123"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web-app-react:
    build:
      context: ./client
      dockerfile: docker/Dockerfile
    container_name: communicator-frontend
    ports:
      - "3010:80"
    environment:
      # nginx template (client/docker/nginx.conf) — reach API by Docker DNS name
      BACKEND_URL: http://api:8080
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
