name: Build and Test .NET Project

on:
  push:
    branches: [ "api/development", "development"]
  pull_request:
    branches: [ "api/development", "development" ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore api/Api/ChatCommunicator.sln

      - name: Build
        run: dotnet build api/Api/ChatCommunicator.sln --no-restore

      - name: Test
        run: dotnet test api/Api/ChatCommunicator.sln --no-build --verbosity normal

  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore api/Api/ChatCommunicator.sln

      - name: Build
        run: dotnet build api/Api/ChatCommunicator.sln --no-restore

      - name: Test
        run: dotnet test api/Api/ChatCommunicator.sln --no-build --verbosity normal
